<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026 - Bracket Simulator</title>
    <meta name="description" content="Play the 2026 World Cup out as FIFA matches with friends: enter scores and get standings, the knockout bracket and head-to-head stats.">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            color-scheme: dark; /* dark native controls, so dropdown text stays readable in Safari */
        }

        button, select, input { font-family: inherit; }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(90deg, #c4a747, #ffd700, #c4a747);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            margin-top: 10px;
            -webkit-text-fill-color: #aaa;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #c4a747, #ffd700);
            color: #1a1a2e;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Group Stage */
        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .group {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .group h3 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .group-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .group-table th, .group-table td {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.85em;
        }

        .group-table th {
            color: #aaa;
            font-size: 0.85em;
        }

        .group-table td.team-name {
            text-align: left;
            font-weight: 500;
        }

        .group-table tr.qualified {
            background: rgba(0, 255, 0, 0.1);
        }

        .group-table tr.third-place {
            background: rgba(255, 255, 0, 0.05);
        }

        .flag {
            width: 24px;
            height: 16px;
            margin-right: 8px;
            vertical-align: middle;
            border-radius: 2px;
        }

        /* Match Card */
        .matches-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(350px, 100%), 1fr)); /* min(): no sideways scroll on phones narrower than 390px */
            gap: 15px;
            margin-top: 20px;
        }

        .match-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .match-card.completed {
            border-color: #4caf50;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #aaa;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-flag {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .team-name-match {
            font-weight: 600;
            font-size: 0.95em;
        }

        .score-input {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .score-input input {
            width: 50px;
            padding: 10px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .score-input input:focus {
            outline: 2px solid #ffd700;
        }

        .vs-text {
            font-size: 1.2em;
            color: #666;
            font-weight: bold;
        }

        .player-select {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .player-select select {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 0.9em;
        }

        .player-select select option {
            background: #1a1a2e;
        }

        .match-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-reset {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .btn-reset:hover {
            background: rgba(255,255,255,0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        .confirm-message {
            line-height: 1.5;
        }

        /* Knockout Bracket */
        .bracket-container {
            overflow-x: auto;
            padding: 20px 0;
        }

        .bracket {
            display: flex;
            gap: 30px;
            min-width: max-content;
            padding: 20px;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-width: 200px;
        }

        .round-title {
            text-align: center;
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: 600;
        }

        .bracket-match {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
        }

        .bracket-match:hover {
            border-color: #ffd700;
        }

        .bracket-match.completed {
            border-color: #4caf50;
        }

        .bracket-team {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-radius: 5px;
            margin: 2px 0;
            overflow: hidden;
        }

        .bracket-team span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .bracket-team.winner {
            background: rgba(76, 175, 80, 0.3);
        }

        .bracket-team.tbd {
            color: #666;
            font-style: italic;
        }

        .bracket-score {
            font-weight: bold;
            color: #ffd700;
        }

        /* Statistics */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .stat-card h3 {
            color: #ffd700;
            margin-bottom: 15px;
            text-align: center;
        }

        .player-stats-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .player-stats-table th, .player-stats-table td {
            padding: 8px 4px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.85em;
        }

        .player-stats-table th {
            color: #aaa;
            font-size: 0.9em;
        }

        .player-stats-table tr:hover {
            background: rgba(255,255,255,0.05);
        }

        /* Player Management */
        .player-management {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .player-management h3 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .player-input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .player-input-row input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .player-tag {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-tag .remove-player {
            cursor: pointer;
            opacity: 0.7;
        }

        .player-tag .remove-player:hover {
            opacity: 1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 2px solid #ffd700;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #ffd700;
        }

        .close-modal {
            font-size: 1.5em;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover {
            color: white;
        }

        /* Data Controls */
        .data-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .data-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .data-btn.save {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
        }

        .data-btn.load {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
        }

        .data-btn.reset {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        .data-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            transform: translateX(150%);
            transition: transform 0.3s;
            z-index: 1001;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(135deg, #4caf50, #45a049);
        }

        .notification.error {
            background: linear-gradient(135deg, #f44336, #d32f2f);
        }

        .notification.info {
            background: linear-gradient(135deg, #2196f3, #1976d2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .match-teams {
                flex-direction: column;
            }

            .score-input {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FIFA World Cup 2026</h1>
            <p>USA / Mexico / Canada - Bracket Simulator</p>
        </header>

        <div class="data-controls">
            <button class="data-btn save" onclick="saveData()">Save Progress</button>
            <button class="data-btn load" onclick="loadProgress()">Load Progress</button>
            <button class="data-btn reset" onclick="resetAll()">Reset All</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('players')">Players</button>
            <button class="tab-btn" onclick="switchTab('groups')">Group Stage</button>
            <button class="tab-btn" onclick="switchTab('knockout')">Knockout Stage</button>
            <button class="tab-btn" onclick="switchTab('stats')">Statistics</button>
        </div>

        <!-- Players Tab -->
        <div id="players-tab" class="tab-content active">
            <div class="player-management">
                <h3>Manage Players</h3>
                <p style="color: #aaa; margin-bottom: 15px;">Add the people who will be playing FIFA matches</p>
                <div class="player-input-row">
                    <input type="text" id="new-player-name" placeholder="Enter player name..." aria-label="Player name" onkeypress="if(event.key==='Enter')addPlayer()">
                    <button class="btn btn-submit" onclick="addPlayer()">Add Player</button>
                </div>
                <div class="player-list" id="player-list"></div>
            </div>
        </div>

        <!-- Group Stage Tab -->
        <div id="groups-tab" class="tab-content">
            <h2 style="text-align: center; margin-bottom: 20px;">Group Stage Matches</h2>
            <div class="matches-container" id="group-matches"></div>

            <h2 style="text-align: center; margin: 40px 0 20px;">Group Standings</h2>
            <div class="groups-container" id="group-standings"></div>
        </div>

        <!-- Knockout Stage Tab -->
        <div id="knockout-tab" class="tab-content">
            <h2 style="text-align: center; margin-bottom: 20px;">Knockout Stage</h2>
            <div class="bracket-container">
                <div class="bracket" id="knockout-bracket"></div>
            </div>
        </div>

        <!-- Statistics Tab -->
        <div id="stats-tab" class="tab-content">
            <div class="stats-container" id="stats-container"></div>
        </div>
    </div>

    <!-- Match Modal -->
    <div class="modal" id="match-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Match Details</h2>
                <span class="close-modal" role="button" aria-label="Close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <div class="modal" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-message">
        <div class="modal-content">
            <p class="confirm-message" id="confirm-message"></p>
            <div class="match-actions" style="margin-top: 20px;">
                <button class="btn btn-reset" id="confirm-cancel">Cancel</button>
                <button class="btn btn-danger" id="confirm-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script>
        // ===== DATA STRUCTURES =====

        // 2026 World Cup Groups (48 teams, 12 groups of 4)
        const worldCupGroups = {
            A: ['USA', 'Morocco', 'Scotland', 'TBD'],
            B: ['Mexico', 'Colombia', 'Ecuador', 'TBD'],
            C: ['Canada', 'Netherlands', 'Australia', 'TBD'],
            D: ['Brazil', 'Italy', 'Albania', 'TBD'],
            E: ['Argentina', 'Poland', 'Ukraine', 'TBD'],
            F: ['Germany', 'Denmark', 'Switzerland', 'TBD'],
            G: ['France', 'Japan', 'Senegal', 'TBD'],
            H: ['Spain', 'Croatia', 'Paraguay', 'TBD'],
            I: ['England', 'Iran', 'Serbia', 'TBD'],
            J: ['Portugal', 'Austria', 'Hungary', 'TBD'],
            K: ['Belgium', 'Chile', 'Nigeria', 'TBD'],
            L: ['South Korea', 'Uruguay', 'Slovenia', 'TBD']
        };

        // Country flags (emoji)
        const flags = {
            'USA': '🇺🇸', 'Mexico': '🇲🇽', 'Canada': '🇨🇦', 'Brazil': '🇧🇷',
            'Argentina': '🇦🇷', 'Germany': '🇩🇪', 'France': '🇫🇷', 'Spain': '🇪🇸',
            'England': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'Portugal': '🇵🇹', 'Belgium': '🇧🇪', 'Netherlands': '🇳🇱',
            'Italy': '🇮🇹', 'Croatia': '🇭🇷', 'Denmark': '🇩🇰', 'Switzerland': '🇨🇭',
            'Poland': '🇵🇱', 'Austria': '🇦🇹', 'Ukraine': '🇺🇦', 'Serbia': '🇷🇸',
            'Morocco': '🇲🇦', 'Senegal': '🇸🇳', 'Nigeria': '🇳🇬', 'Iran': '🇮🇷',
            'Japan': '🇯🇵', 'South Korea': '🇰🇷', 'Australia': '🇦🇺', 'Colombia': '🇨🇴',
            'Ecuador': '🇪🇨', 'Uruguay': '🇺🇾', 'Paraguay': '🇵🇾', 'Chile': '🇨🇱',
            'Scotland': '🏴󠁧󠁢󠁳󠁣󠁴󠁿', 'Hungary': '🇭🇺', 'Slovenia': '🇸🇮', 'Albania': '🇦🇱',
            'TBD': '🏳️'
        };

        // Game State
        let gameState = {
            players: [],
            groupMatches: {},
            knockoutMatches: {},
            standings: {}
        };

        // Player names are typed by users: escape them before putting them in HTML
        function escapeHtml(text) {
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function playerOptions(selected) {
            return gameState.players.map(p => `<option value="${escapeHtml(p)}" ${selected === p ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('');
        }

        // ===== INITIALIZATION =====

        function init() {
            loadData();
            initializeGroupMatches();
            initializeStandings();
            initializeKnockout();
            renderAll();
        }

        function initializeGroupMatches() {
            if (Object.keys(gameState.groupMatches).length > 0) return;

            let matchId = 1;
            for (const [group, teams] of Object.entries(worldCupGroups)) {
                for (let i = 0; i < teams.length; i++) {
                    for (let j = i + 1; j < teams.length; j++) {
                        gameState.groupMatches[`G${matchId}`] = {
                            id: `G${matchId}`,
                            group: group,
                            team1: teams[i],
                            team2: teams[j],
                            score1: null,
                            score2: null,
                            player1: '',
                            player2: '',
                            completed: false
                        };
                        matchId++;
                    }
                }
            }
        }

        function initializeStandings() {
            if (Object.keys(gameState.standings).length > 0) return;

            for (const [group, teams] of Object.entries(worldCupGroups)) {
                gameState.standings[group] = teams.map(team => ({
                    team: team,
                    played: 0,
                    won: 0,
                    drawn: 0,
                    lost: 0,
                    goalsFor: 0,
                    goalsAgainst: 0,
                    points: 0
                }));
            }
        }

        // Knockout bracket matchup definitions
        // Format: [team1Source, team2Source] where source is like "1A" (winner of group A) or "2B" (runner-up of group B)
        const knockoutMatchups = {
            R32: [
                { id: 'R32_1', team1Source: '1A', team2Source: '2C' },
                { id: 'R32_2', team1Source: '1B', team2Source: '2D' },
                { id: 'R32_3', team1Source: '1C', team2Source: '2A' },
                { id: 'R32_4', team1Source: '1D', team2Source: '2B' },
                { id: 'R32_5', team1Source: '1E', team2Source: '2G' },
                { id: 'R32_6', team1Source: '1F', team2Source: '2H' },
                { id: 'R32_7', team1Source: '1G', team2Source: '2E' },
                { id: 'R32_8', team1Source: '1H', team2Source: '2F' },
                { id: 'R32_9', team1Source: '1I', team2Source: '2K' },
                { id: 'R32_10', team1Source: '1J', team2Source: '2L' },
                { id: 'R32_11', team1Source: '1K', team2Source: '2I' },
                { id: 'R32_12', team1Source: '1L', team2Source: '2J' }
            ]
        };

        function getGroupPosition(group, position) {
            // Get the team at a specific position (1 = winner, 2 = runner-up) from a group
            const standings = gameState.standings[group];
            if (!standings) return null;

            // Sort by points, then goal difference, then goals for
            const sorted = [...standings].sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                const gdA = a.goalsFor - a.goalsAgainst;
                const gdB = b.goalsFor - b.goalsAgainst;
                if (gdB !== gdA) return gdB - gdA;
                return b.goalsFor - a.goalsFor;
            });

            // Check if enough matches played to determine position
            // A group is complete when all teams have played 3 matches
            const allMatchesPlayed = sorted.every(t => t.played === 3);

            if (allMatchesPlayed && sorted[position - 1]) {
                return sorted[position - 1].team;
            }
            return null;
        }

        function getTeamFromSource(source) {
            // Parse source like "1A" (winner of A) or "2B" (runner-up of B)
            if (!source || source.length < 2) return null;

            const position = parseInt(source[0]);
            const group = source[1];

            if (position >= 1 && position <= 2 && group >= 'A' && group <= 'L') {
                return getGroupPosition(group, position);
            }
            return null;
        }

        function getSourceLabel(source) {
            if (!source) return 'TBD';

            // Handle group sources like "1A", "2B"
            if (source.length === 2 && !isNaN(parseInt(source[0]))) {
                const position = parseInt(source[0]);
                const group = source[1];
                return position === 1 ? `Winner ${group}` : `Runner-up ${group}`;
            }

            // Handle knockout sources like "W R32_1", "L SF_1"
            if (source.startsWith('W ')) {
                return `Winner ${source.substring(2)}`;
            }
            if (source.startsWith('L ')) {
                return `Loser ${source.substring(2)}`;
            }

            return source;
        }

        function initializeKnockout() {
            if (Object.keys(gameState.knockoutMatches).length > 0) return;

            // Round of 32 (12 matches - top 2 from each of 12 groups = 24 teams)
            for (const matchup of knockoutMatchups.R32) {
                gameState.knockoutMatches[matchup.id] = {
                    id: matchup.id,
                    round: 'Round of 32',
                    team1: null,
                    team2: null,
                    team1Source: matchup.team1Source,
                    team2Source: matchup.team2Source,
                    score1: null,
                    score2: null,
                    player1: '',
                    player2: '',
                    completed: false
                };
            }

            // Round of 16 (6 matches)
            for (let i = 1; i <= 6; i++) {
                gameState.knockoutMatches[`R16_${i}`] = {
                    id: `R16_${i}`,
                    round: 'Round of 16',
                    team1: null,
                    team2: null,
                    team1Source: `W R32_${i*2-1}`,
                    team2Source: `W R32_${i*2}`,
                    score1: null,
                    score2: null,
                    player1: '',
                    player2: '',
                    completed: false
                };
            }

            // Quarter Finals (3 matches, but we need 4 for semis - adjust bracket)
            // With 12 R32 matches -> 6 R16 matches -> need to handle odd bracket
            // Let's do 4 QF matches with byes for top teams
            for (let i = 1; i <= 3; i++) {
                gameState.knockoutMatches[`QF_${i}`] = {
                    id: `QF_${i}`,
                    round: 'Quarter Finals',
                    team1: null,
                    team2: null,
                    team1Source: `W R16_${i*2-1}`,
                    team2Source: `W R16_${i*2}`,
                    score1: null,
                    score2: null,
                    player1: '',
                    player2: '',
                    completed: false
                };
            }

            // Semi Finals
            // With 3 QF matches, we have an odd number
            // SF_1: QF_1 winner vs QF_2 winner
            // SF_2: QF_3 winner gets a bye to the final OR plays the winner of SF_1
            // For simplicity, let's just have QF_3 winner go straight to final
            gameState.knockoutMatches['SF_1'] = {
                id: 'SF_1',
                round: 'Semi Finals',
                team1: null,
                team2: null,
                team1Source: 'W QF_1',
                team2Source: 'W QF_2',
                score1: null,
                score2: null,
                player1: '',
                player2: '',
                completed: false
            };

            // Third Place - loser of SF_1 vs loser of QF_3 (who didn't get a semifinal)
            gameState.knockoutMatches['3RD'] = {
                id: '3RD',
                round: 'Third Place',
                team1: null,
                team2: null,
                team1Source: 'L SF_1',
                team2Source: 'L QF_3',
                score1: null,
                score2: null,
                player1: '',
                player2: '',
                completed: false
            };

            // Final - SF_1 winner vs QF_3 winner
            gameState.knockoutMatches['FINAL'] = {
                id: 'FINAL',
                round: 'Final',
                team1: null,
                team2: null,
                team1Source: 'W SF_1',
                team2Source: 'W QF_3',
                score1: null,
                score2: null,
                player1: '',
                player2: '',
                completed: false
            };
        }

        function updateKnockoutFromGroups() {
            // Update R32 teams based on group standings
            for (const matchId of Object.keys(gameState.knockoutMatches)) {
                const match = gameState.knockoutMatches[matchId];

                // Only update R32 matches from group sources (format like "1A", "2B").
                // A group that is no longer complete (a match was reset) clears its slot again.
                if (match.team1Source && match.team1Source.length === 2 && !match.completed) {
                    match.team1 = getTeamFromSource(match.team1Source);
                }

                if (match.team2Source && match.team2Source.length === 2 && !match.completed) {
                    match.team2 = getTeamFromSource(match.team2Source);
                }
            }
        }

        // ===== RENDERING =====

        function renderAll() {
            renderPlayers();
            renderGroupMatches();
            renderGroupStandings();
            updateKnockoutFromGroups(); // Update knockout teams from group results
            renderKnockout();
            renderStats();
        }

        function renderPlayers() {

            container.innerHTML = gameState.players.map((player, idx) => `
                <div class="player-tag">

        function renderGroupMatches() {
            const container = document.getElementById('group-matches');
            const matchesByGroup = {};

            for (const match of Object.values(gameState.groupMatches)) {
                if (!matchesByGroup[match.group]) matchesByGroup[match.group] = [];
                matchesByGroup[match.group].push(match);
            }

            let html = '';
            for (const [group, matches] of Object.entries(matchesByGroup)) {
                html += `<div class="group"><h3>Group ${group}</h3>`;

            for (const [inputId, value] of Object.entries(typed)) {

        // Empty the score boxes (one match, or all) so a re-render doesn't carry typed scores over
        function clearTypedScores(matchId) {
            const selector = matchId ? `#score1-${matchId}, #score2-${matchId}` : '#group-matches .score-input input';
            document.querySelectorAll(selector).forEach(input => { input.value = ''; });

                <div class="match-card ${completedClass}" id="match-${match.id}">

        }

        function renderGroupStandings() {
            const container = document.getElementById('group-standings');
            let html = '';

            for (const [group, teams] of Object.entries(gameState.standings)) {
                // Sort by points, then goal difference, then goals for
                const sorted = [...teams].sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    const gdA = a.goalsFor - a.goalsAgainst;
                    const gdB = b.goalsFor - b.goalsAgainst;
                    if (gdB !== gdA) return gdB - gdA;
                    return b.goalsFor - a.goalsFor;
                });

                html += `
                    <div class="group">
                        <h3>Group ${group}</h3>
                        <table class="group-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>Team</th>
                                    <th>P</th>
                                    <th>W</th>
                                    <th>D</th>
                                    <th>L</th>
                                    <th>GF</th>
                                    <th>GA</th>
                                    <th>GD</th>
                                    <th>Pts</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${sorted.map((team, idx) => `

        function renderKnockout() {
            const container = document.getElementById('knockout-bracket');

            const rounds = [
                { name: 'Round of 32', prefix: 'R32_', count: 12 },
                { name: 'Round of 16', prefix: 'R16_', count: 6 },
                { name: 'Quarter Finals', prefix: 'QF_', count: 3 },
                { name: 'Semi Final', prefix: 'SF_', count: 1 },
                { name: 'Final', prefix: 'FINAL', count: 1 }
            ];

            let html = '';
            for (const round of rounds) {
                html += `<div class="round"><div class="round-title">${round.name}</div>`;

                if (round.prefix === 'FINAL') {
                    html += renderBracketMatch(gameState.knockoutMatches['FINAL']);
                    html += '<div class="round-title" style="margin-top: 20px;">Third Place</div>';
                    html += renderBracketMatch(gameState.knockoutMatches['3RD']);
                } else {
                    for (let i = 1; i <= round.count; i++) {
                        const match = gameState.knockoutMatches[`${round.prefix}${i}`];
                        if (match) html += renderBracketMatch(match);
                    }
                }
                html += '</div>';
            }
            container.innerHTML = html;
        }

        function renderBracketMatch(match) {
            // Get display name - either actual team or source label
            const team1Display = match.team1 || getSourceLabel(match.team1Source);
            const team2Display = match.team2 || getSourceLabel(match.team2Source);
            const flag1 = match.team1 ? (flags[match.team1] || '🏳️') : '';
            const flag2 = match.team2 ? (flags[match.team2] || '🏳️') : '';
            const completedClass = match.completed ? 'completed' : '';

            let winner = null;
            if (match.completed && match.score1 !== null && match.score2 !== null) {
                winner = match.score1 > match.score2 ? 1 : (match.score2 > match.score1 ? 2 : 0);
            }

            return `
                <div class="bracket-match ${completedClass}" onclick="openKnockoutModal('${match.id}')">
                    <div class="bracket-team ${winner === 1 ? 'winner' : ''} ${!match.team1 ? 'tbd' : ''}">
                        <span>${flag1} ${team1Display}</span>
                        <span class="bracket-score">${match.score1 !== null ? match.score1 : '-'}</span>
                    </div>
                    <div class="bracket-team ${winner === 2 ? 'winner' : ''} ${!match.team2 ? 'tbd' : ''}">
                        <span>${flag2} ${team2Display}</span>
                        <span class="bracket-score">${match.score2 !== null ? match.score2 : '-'}</span>
                    </div>
                </div>
            `;
        }

        function renderStats() {
            const container = document.getElementById('stats-container');
            const playerStats = calculatePlayerStats();

            const html = `
                <div class="stat-card">

                <div class="stat-card">
                    <h3>Tournament Progress</h3>
                    <table class="player-stats-table">
                        <thead>
                            <tr>
                                <th>Stage</th>
                                <th>Completed</th>
                                <th>Total</th>
                                <th>Progress</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Group Stage</td>
                                <td>${Object.values(gameState.groupMatches).filter(m => m.completed).length}</td>
                                <td>${Object.keys(gameState.groupMatches).length}</td>
                                <td>${Math.round(Object.values(gameState.groupMatches).filter(m => m.completed).length / Object.keys(gameState.groupMatches).length * 100)}%</td>
                            </tr>
                            <tr>
                                <td>Knockout Stage</td>
                                <td>${Object.values(gameState.knockoutMatches).filter(m => m.completed).length}</td>

                </div>

                <div class="stat-card">
                    <h3>Head to Head</h3>
                    ${renderHeadToHead(playerStats)}

            container.innerHTML = html;
        }

        function renderHeadToHead(playerStats) {
            if (gameState.players.length < 2) {
                return '<p style="text-align:center; color:#aaa;">Add at least 2 players to see head-to-head stats</p>';
            }

            const h2h = {};
            gameState.players.forEach(p1 => {
                h2h[p1] = {};
                gameState.players.forEach(p2 => {
                    if (p1 !== p2) h2h[p1][p2] = { won: 0, lost: 0, drawn: 0 };
                });
            });

            // Calculate from all matches
            const allMatches = [...Object.values(gameState.groupMatches), ...Object.values(gameState.knockoutMatches)];
            for (const match of allMatches) {
                if (!match.completed || !match.player1 || !match.player2) continue;
                if (match.player1 === match.player2) continue;
                // Skip matches played by someone who has since been removed from the player list
                if (!h2h[match.player1] || !h2h[match.player2]) continue;

                const p1 = match.player1;
                const p2 = match.player2;

                if (match.score1 > match.score2) {
                    h2h[p1][p2].won++;
                    h2h[p2][p1].lost++;
                } else if (match.score2 > match.score1) {
                    h2h[p2][p1].won++;
                    h2h[p1][p2].lost++;
                } else {
                    h2h[p1][p2].drawn++;
                    h2h[p2][p1].drawn++;
                }
            }

            let html = '<table class="player-stats-table"><thead><tr><th></th>';
            gameState.players.forEach(p => html += `<th>${escapeHtml(p)}</th>`);
            html += '</tr></thead><tbody>';

            gameState.players.forEach(p1 => {
                html += `<tr><td><strong>${escapeHtml(p1)}</strong></td>`;
                gameState.players.forEach(p2 => {
                    if (p1 === p2) {
                        html += '<td>-</td>';
                    } else {
                        const record = h2h[p1][p2];
                        html += `<td>${record.won}-${record.drawn}-${record.lost}</td>`;
                    }
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        function calculatePlayerStats() {
            const stats = {};
            gameState.players.forEach(p => {
                stats[p] = { played: 0, won: 0, lost: 0, drawn: 0, goalsFor: 0, goalsAgainst: 0 };
            });

            const allMatches = [...Object.values(gameState.groupMatches), ...Object.values(gameState.knockoutMatches)];

            for (const match of allMatches) {
                if (!match.completed) continue;

                if (match.player1 && stats[match.player1]) {
                    stats[match.player1].played++;
                    stats[match.player1].goalsFor += match.score1;
                    stats[match.player1].goalsAgainst += match.score2;
                    if (match.score1 > match.score2) stats[match.player1].won++;
                    else if (match.score1 < match.score2) stats[match.player1].lost++;
                    else stats[match.player1].drawn++;
                }

                if (match.player2 && stats[match.player2]) {
                    stats[match.player2].played++;
                    stats[match.player2].goalsFor += match.score2;
                    stats[match.player2].goalsAgainst += match.score1;
                    if (match.score2 > match.score1) stats[match.player2].won++;
                    else if (match.score2 < match.score1) stats[match.player2].lost++;
                    else stats[match.player2].drawn++;
                }
            }

            return stats;
        }

        // ===== ACTIONS =====

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        function addPlayer() {
            const input = document.getElementById('new-player-name');
            const name = input.value.trim();

            if (!name) {
                showNotification('Please enter a player name', 'error');
                return;
            }

            if (gameState.players.includes(name)) {
                showNotification('Player already exists', 'error');
                return;
            }

            gameState.players.push(name);
            input.value = '';
            renderAll();
            showNotification(`${name} added!`, 'success');
        }

        function removePlayer(name) {
            gameState.players = gameState.players.filter(p => p !== name);
            renderAll();
            showNotification(`${name} removed`, 'info');
        }

        function updateMatchPlayer(matchId, playerNum, value) {
            if (gameState.groupMatches[matchId]) {
                gameState.groupMatches[matchId][`player${playerNum}`] = value;
            } else if (gameState.knockoutMatches[matchId]) {
                gameState.knockoutMatches[matchId][`player${playerNum}`] = value;
            }
        }

        function submitMatch(matchId) {
            const match = gameState.groupMatches[matchId] || gameState.knockoutMatches[matchId];
            if (!match) return;

            const score1 = parseInt(document.getElementById(`score1-${matchId}`).value);
            const score2 = parseInt(document.getElementById(`score2-${matchId}`).value);

            if (isNaN(score1) || isNaN(score2)) {
                showNotification('Please enter both scores', 'error');
                return;
            }

            // Re-submitting a finished group match: take its old result out of the standings first
            if (match.completed && gameState.groupMatches[matchId]) {
                reverseStandings(match);
            }

            // Update match
            match.score1 = score1;
            match.score2 = score2;
            match.completed = true;

            // Update standings if group match
            if (gameState.groupMatches[matchId]) {
                updateStandings(match);
            }

            // Update knockout bracket progression
            if (gameState.knockoutMatches[matchId]) {
                updateKnockoutProgression(matchId);
            }

            renderAll();
            showNotification('Match result saved!', 'success');
        }

        function resetMatch(matchId) {
            const match = gameState.groupMatches[matchId] || gameState.knockoutMatches[matchId];
            if (!match) return;

            // If was completed, reverse standings
            if (match.completed && gameState.groupMatches[matchId]) {
                reverseStandings(match);
            }

            match.score1 = null;
            match.score2 = null;
            match.completed = false;

            clearTypedScores(matchId);
            renderAll();
            showNotification('Match reset', 'info');
        }

        function updateStandings(match) {
            const group = match.group;
            const team1Stats = gameState.standings[group].find(t => t.team === match.team1);
            const team2Stats = gameState.standings[group].find(t => t.team === match.team2);

            if (!team1Stats || !team2Stats) return;

            team1Stats.played++;
            team2Stats.played++;
            team1Stats.goalsFor += match.score1;
            team1Stats.goalsAgainst += match.score2;
            team2Stats.goalsFor += match.score2;
            team2Stats.goalsAgainst += match.score1;

            if (match.score1 > match.score2) {
                team1Stats.won++;
                team1Stats.points += 3;
                team2Stats.lost++;
            } else if (match.score2 > match.score1) {
                team2Stats.won++;
                team2Stats.points += 3;
                team1Stats.lost++;
            } else {
                team1Stats.drawn++;
                team2Stats.drawn++;
                team1Stats.points += 1;
                team2Stats.points += 1;
            }
        }

        function reverseStandings(match) {
            const group = match.group;
            const team1Stats = gameState.standings[group].find(t => t.team === match.team1);
            const team2Stats = gameState.standings[group].find(t => t.team === match.team2);

            if (!team1Stats || !team2Stats) return;

            team1Stats.played--;
            team2Stats.played--;
            team1Stats.goalsFor -= match.score1;
            team1Stats.goalsAgainst -= match.score2;
            team2Stats.goalsFor -= match.score2;
            team2Stats.goalsAgainst -= match.score1;

            if (match.score1 > match.score2) {
                team1Stats.won--;
                team1Stats.points -= 3;
                team2Stats.lost--;
            } else if (match.score2 > match.score1) {
                team2Stats.won--;
                team2Stats.points -= 3;
                team1Stats.lost--;
            } else {
                team1Stats.drawn--;
                team2Stats.drawn--;
                team1Stats.points -= 1;
                team2Stats.points -= 1;
            }
        }

        function updateKnockoutProgression(matchId) {
            const match = gameState.knockoutMatches[matchId];
            if (!match || !match.completed) return;

            const winner = match.score1 > match.score2 ? match.team1 :
                          (match.score2 > match.score1 ? match.team2 : null);
            const loser = match.score1 > match.score2 ? match.team2 :
                         (match.score2 > match.score1 ? match.team1 : null);

            if (!winner) return; // Draw - needs penalty shootout handling

            // Find next match and update
            for (const nextMatch of Object.values(gameState.knockoutMatches)) {
                if (nextMatch.team1Source === `W ${matchId}`) {
                    nextMatch.team1 = winner;
                }
                if (nextMatch.team2Source === `W ${matchId}`) {
                    nextMatch.team2 = winner;
                }
                if (nextMatch.team1Source === `L ${matchId}`) {
                    nextMatch.team1 = loser;
                }
                if (nextMatch.team2Source === `L ${matchId}`) {
                    nextMatch.team2 = loser;
                }
            }
        }

        function openKnockoutModal(matchId) {
            const match = gameState.knockoutMatches[matchId];
            if (!match) return;

            const flag1 = match.team1 ? (flags[match.team1] || '🏳️') : '';
            const flag2 = match.team2 ? (flags[match.team2] || '🏳️') : '';
            const team1Display = match.team1 || getSourceLabel(match.team1Source);
            const team2Display = match.team2 || getSourceLabel(match.team2Source);

            document.getElementById('modal-title').textContent = match.round;
            document.getElementById('modal-body').innerHTML = `
                <div class="match-teams" style="margin-bottom: 20px;">
                    <div class="team">
                        <div class="team-flag">${flag1}</div>
                        <div class="team-name-match">${team1Display}</div>
                    </div>
                    <div class="vs-text">VS</div>
                    <div class="team">
                        <div class="team-flag">${flag2}</div>
                        <div class="team-name-match">${team2Display}</div>
                    </div>
                </div>

                ${match.team1 && match.team2 ? `
                    <div class="score-input" style="justify-content: center; margin: 20px 0;">
                        <input type="number" min="0" max="99" id="modal-score1" aria-label="${team1Display} score"
                            value="${match.score1 !== null ? match.score1 : ''}" placeholder="-">
                        <span class="vs-text">:</span>
                        <input type="number" min="0" max="99" id="modal-score2" aria-label="${team2Display} score"
                            value="${match.score2 !== null ? match.score2 : ''}" placeholder="-">
                    </div>

                    <div class="player-select">
                        <select id="modal-player1" aria-label="Player for ${team1Display}">
                            <option value="">Select Player</option>
                            ${playerOptions(match.player1)}
                        </select>
                        <select id="modal-player2" aria-label="Player for ${team2Display}">
                            <option value="">Select Player</option>
                            ${playerOptions(match.player2)}
                        </select>
                    </div>

                    <div class="match-actions" style="margin-top: 20px;">
                        <button class="btn btn-submit" onclick="submitKnockoutMatch('${matchId}')">Submit Result</button>
                        <button class="btn btn-reset" onclick="resetKnockoutMatch('${matchId}')">Reset</button>
                    </div>
                ` : `
                    <p style="text-align: center; color: #aaa;">Teams not yet determined. Complete previous rounds first.</p>
                `}
            `;

            document.getElementById('match-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('match-modal').classList.remove('active');
        }

        function submitKnockoutMatch(matchId) {
            const match = gameState.knockoutMatches[matchId];
            if (!match) return;

            const score1 = parseInt(document.getElementById('modal-score1').value);
            const score2 = parseInt(document.getElementById('modal-score2').value);
            const player1 = document.getElementById('modal-player1').value;
            const player2 = document.getElementById('modal-player2').value;

            if (isNaN(score1) || isNaN(score2)) {
                showNotification('Please enter both scores', 'error');
                return;
            }

            if (score1 === score2) {
                showNotification('Knockout matches cannot end in a draw. Please include penalty shootout result.', 'error');
                return;
            }

            match.score1 = score1;
            match.score2 = score2;
            match.player1 = player1;
            match.player2 = player2;
            match.completed = true;

            updateKnockoutProgression(matchId);
            closeModal();
            renderAll();
            showNotification('Match result saved!', 'success');
        }

        function resetKnockoutMatch(matchId) {
            const match = gameState.knockoutMatches[matchId];
            if (!match) return;

            match.score1 = null;
            match.score2 = null;
            match.completed = false;

            // Take this match's winner/loser back out of the next round (unless that match is already played)
            for (const nextMatch of Object.values(gameState.knockoutMatches)) {
                if (nextMatch.completed) continue;
                if (nextMatch.team1Source === `W ${matchId}` || nextMatch.team1Source === `L ${matchId}`) nextMatch.team1 = null;
                if (nextMatch.team2Source === `W ${matchId}` || nextMatch.team2Source === `L ${matchId}`) nextMatch.team2 = null;
            }

            closeModal();
            renderAll();
            showNotification('Match reset', 'info');
        }

        // ===== DATA PERSISTENCE =====

        function saveData() {
            localStorage.setItem('worldcup2026', JSON.stringify(gameState));
            showNotification('Progress saved!', 'success');
        }

        function loadData() {
            const saved = localStorage.getItem('worldcup2026');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState = { ...gameState, ...parsed };
                } catch (e) {
                    console.error('Failed to load saved data');
                }
            }
        }

        // Load Progress button: read the saved tournament and show it
        function loadProgress() {
            if (!localStorage.getItem('worldcup2026')) {
                showNotification('No saved progress found', 'error');
                return;
            }
            loadData();
            clearTypedScores();
            renderAll();
            showNotification('Progress loaded!', 'success');
        }

        // In-page replacement for the browser's confirm(): resolves true on OK/Enter, false on Cancel/Escape/backdrop
        function appConfirm(message) {
            return new Promise(resolve => {
                const modal = document.getElementById('confirm-modal');
                const okBtn = document.getElementById('confirm-ok');
                const cancelBtn = document.getElementById('confirm-cancel');
                document.getElementById('confirm-message').textContent = message;
                const finish = (result) => {
                    modal.classList.remove('active');
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                    modal.removeEventListener('click', onBackdrop);
                    document.removeEventListener('keydown', onKey, true);
                    resolve(result);
                };
                const onOk = () => finish(true);
                const onCancel = () => finish(false);
                const onBackdrop = (e) => { if (e.target === modal) finish(false); };
                const onKey = (e) => {
                    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
                    else if (e.key === 'Enter') { e.preventDefault(); finish(document.activeElement !== cancelBtn); }
                };
                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
                modal.addEventListener('click', onBackdrop);
                document.addEventListener('keydown', onKey, true);
                modal.classList.add('active');
                okBtn.focus();
            });
        }

        async function resetAll() {
            if (!(await appConfirm('Are you sure you want to reset all progress? This cannot be undone.'))) return;

            localStorage.removeItem('worldcup2026');
            gameState = {
                players: [],
                groupMatches: {},
                knockoutMatches: {},
                standings: {}
            };
            initializeGroupMatches();
            initializeStandings();
            initializeKnockout();
            clearTypedScores();
            renderAll();
            showNotification('All progress reset', 'info');
        }

        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);

        // Close modal on outside click
        document.getElementById('match-modal').addEventListener('click', (e) => {
            if (e.target.id === 'match-modal') closeModal();
        });
    </script>
</body>
</html>
